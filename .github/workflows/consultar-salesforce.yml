name: Exportar Matricula y Solicitud Salesforce (solo lectura)

on:
  workflow_dispatch:
  push:
    branches: [Testeo-data-sf]
    paths:
      - .github/workflows/consultar-salesforce.yml
      - scripts/contar_salesforce.py
      - scripts/exportar_salesforce.py
      - tests/test_conteo_salesforce.py
      - tests/test_exportar_salesforce.py

permissions:
  contents: read

concurrency:
  group: consulta-salesforce-${{ github.repository }}
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar cliente de lectura
        run: python -m pip install simple-salesforce openpyxl
      - name: Verificar diagnóstico con consultas simuladas
        env:
          SF_PUBLICAR_CONTEOS: "false"
        run: python -m unittest discover -s tests -p 'test_*salesforce.py' -v
      - name: Exportar registros actuales a Excel (sin borrar ni insertar)
        env:
          SF_PUBLICAR_CONTEOS: "true"
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
        run: python scripts/exportar_salesforce.py
      - name: Guardar Excel descargable
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: datos-matricula-salesforce-${{ github.run_id }}-${{ github.run_attempt }}
          path: resultados-salesforce/datos_matricula_salesforce.xlsx
          if-no-files-found: warn
          retention-days: 1
