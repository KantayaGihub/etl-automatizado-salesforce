name: Validar ETL 2025 y 2026 sin Salesforce

on:
  push:
    branches: [Fixing-etl-rc]
    paths:
      - .github/workflows/validar-etl.yml
      - .github/workflows/etl.yml
      - etl/**
      - scripts/resumir_validacion.py
      - tests/**

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar cambios sin servicios externos
        run: python -m unittest discover -s tests -v

      - name: Ejecutar Asistencia Regular 2025 - Descargar
        id: paso_01
        continue-on-error: true
        timeout-minutes: 4
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python "etl/procesos/2025/1. asistencia_regular/01_descargar.py"

      - name: Ejecutar Asistencia Regular 2025 - Transformacion
        id: paso_02
        continue-on-error: true
        timeout-minutes: 4
        run: python "etl/procesos/2025/1. asistencia_regular/02_transformacion.py"

      - name: Ejecutar Asistencia Regular 2026 - Descargar
        id: paso_03
        continue-on-error: true
        timeout-minutes: 4
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python "etl/procesos/2026/1. asistencia_regular/01_descargar.py"

      - name: Ejecutar Asistencia Regular 2026 - Transformacion
        id: paso_04
        continue-on-error: true
        timeout-minutes: 4
        run: python "etl/procesos/2026/1. asistencia_regular/02_transformacion.py"

      - name: Ejecutar Consolidacion - Asistencia Regular
        id: paso_05
        continue-on-error: true
        timeout-minutes: 4
        run: python "etl/procesos/consolidacion/1_asistencia_regular.py"

      - name: Ejecutar Extracurriculares 2025 - Descargar
        id: paso_06
        continue-on-error: true
        timeout-minutes: 4
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python "etl/procesos/2025/2. asistencia_extracurricular/01_descarga.py"

      - name: Ejecutar Extracurriculares 2025 - Transformacion
        id: paso_07
        continue-on-error: true
        timeout-minutes: 4
        run: python "etl/procesos/2025/2. asistencia_extracurricular/02_transformacion.py"

      - name: Ejecutar Extracurriculares 2026 - Descargar
        id: paso_08
        continue-on-error: true
        timeout-minutes: 4
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python "etl/procesos/2026/2. asistencia_extracurricular/01_descarga.py"

      - name: Ejecutar Extracurriculares 2026 - Transformacion
        id: paso_09
        continue-on-error: true
