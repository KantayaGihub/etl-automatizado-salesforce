        run: python "etl/procesos/2025/8. solicitud_matricula/02_transformacion.py"

      - name: Ejecutar Solicitud Matricula 2026 - Descargar
        id: paso_28
        continue-on-error: true
        timeout-minutes: 4
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python "etl/procesos/2026/8. solicitud_matricula/01_descargar.py"

      - name: Ejecutar Solicitud Matricula 2026 - Transformacion
        id: paso_29
        continue-on-error: true
