      - name: Ejecutar Asistencia Actividades Vivenciales 2025 - Descargar
        id: paso_36
        continue-on-error: true
        timeout-minutes: 4
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python "etl/procesos/2025/10. Asistencia Actividades Vivenciales/01_descarga.py"

      - name: Ejecutar Asistencia Actividades Vivenciales 2025 - Transformacion
        id: paso_37
        continue-on-error: true
        timeout-minutes: 4
        run: python "etl/procesos/2025/10. Asistencia Actividades Vivenciales/02_transformacion.py"

      - name: Ejecutar Asistencia Actividades Vivenciales 2026 - Descargar
        id: paso_38
        continue-on-error: true
        timeout-minutes: 4
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python "etl/procesos/2026/10. Asistencia Actividades Vivenciales/01_descarga.py"

      - name: Ejecutar Asistencia Actividades Vivenciales 2026 - Transformacion
        id: paso_39
        continue-on-error: true
        timeout-minutes: 4
        run: python "etl/procesos/2026/10. Asistencia Actividades Vivenciales/02_transformacion.py"

      - name: Ejecutar Consolidacion - Asistencia Actividades Vivenciales
        id: paso_40
        continue-on-error: true
        timeout-minutes: 4
        run: python "etl/procesos/consolidacion/10_asistencia_act_vivenciales.py"

      - name: Ejecutar Habilidades 2025 - Descargar
        id: paso_41
        continue-on-error: true
        timeout-minutes: 4
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python "etl/procesos/2025/11. Habilidades/01_descarga.py"

      - name: Ejecutar Habilidades 2025 - Transformacion
        id: paso_42
        continue-on-error: true
        timeout-minutes: 4
        run: python "etl/procesos/2025/11. Habilidades/02_transformacion.py"

      - name: Ejecutar Habilidades 2026 - Descargar
        id: paso_43
        continue-on-error: true
        timeout-minutes: 4
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python "etl/procesos/2026/11. Habilidades/01_descarga.py"

      - name: Ejecutar Habilidades 2026 - Transformacion
        id: paso_44
        continue-on-error: true
        timeout-minutes: 4
        run: python "etl/procesos/2026/11. Habilidades/02_transformacion.py"

      - name: Ejecutar Consolidacion - Habilidades
        id: paso_45
        continue-on-error: true
        timeout-minutes: 4
        run: python "etl/procesos/consolidacion/11_habilidades.py"

      - name: Resumir resultados
        id: resumen
        if: ${{ always() }}
        env:
          PASOS_JSON: ${{ toJSON(steps) }}
        run: |
          python scripts/resumir_validacion.py
          cat resultados-validacion/resumen.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar fuentes, salidas e informes
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validacion-etl-2025-2026-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            data/
            resultados-validacion/
          if-no-files-found: warn
          retention-days: 1

      - name: Marcar errores despues de guardar resultados
        if: ${{ always() && (steps.resumen.outcome != 'success' || steps.resumen.outputs.con_errores == 'true') }}
        run: exit 1
