name: ETL-Automatico-Salesforce

# La primera carga protegida es manual; la programación se reactivará tras verificarla.
on:
  workflow_dispatch:
    inputs:
      cargar_salesforce:
        description: Aplicar reemplazo de datos en Salesforce sin backup
        type: boolean
        default: false
  push:
    branches: [Fixing-etl-rc]
    paths:
      - .github/workflows/etl.yml
      - etl/**
      - tests/**

permissions:
  contents: read

concurrency:
  group: etl-salesforce-${{ github.repository }}
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Instalar dependencias
      run: pip install -r requirements.txt

    - name: Verificar transformacion y consolidacion sin servicios externos
      run: python -m unittest discover -s tests -v

    - name: Ejecutar Asistencia Regular 2025 - Descargar
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: python "etl/procesos/2025/1. asistencia_regular/01_descargar.py"

    - name: Ejecutar Asistencia Regular 2025 - Transformacion
      run: python "etl/procesos/2025/1. asistencia_regular/02_transformacion.py"

    - name: Ejecutar Asistencia Regular 2026 - Descargar
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: python "etl/procesos/2026/1. asistencia_regular/01_descargar.py"

    - name: Ejecutar Asistencia Regular 2026 - Transformacion
      run: python "etl/procesos/2026/1. asistencia_regular/02_transformacion.py"

    - name: Ejecutar Consolidacion - Asistencia Regular
      run: python "etl/procesos/consolidacion/1_asistencia_regular.py"

    - name: Ejecutar Extracurriculares 2025 - Descargar
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: python "etl/procesos/2025/2. asistencia_extracurricular/01_descarga.py"

    - name: Ejecutar Extracurriculares 2025 - Transformacion
      run: python "etl/procesos/2025/2. asistencia_extracurricular/02_transformacion.py"

    - name: Ejecutar Extracurriculares 2026 - Descargar
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: python "etl/procesos/2026/2. asistencia_extracurricular/01_descarga.py"

    - name: Ejecutar Extracurriculares 2026 - Transformacion
      run: python "etl/procesos/2026/2. asistencia_extracurricular/02_transformacion.py"

    - name: Ejecutar Consolidacion - Extracurriculares
      run: python "etl/procesos/consolidacion/2_asistencia_extracurricular.py"

    - name: Ejecutar Matricula 2025 - Descargar
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: python "etl/procesos/2025/3. matricula/01_descarga.py"

    - name: Ejecutar Matricula 2025 - Transformacion
      run: python "etl/procesos/2025/3. matricula/02_transformacion.py"

    - name: Ejecutar Matricula 2026 - Descargar
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: python "etl/procesos/2026/3. matricula/01_descarga.py"

    - name: Ejecutar Matricula 2026 - Transformacion
      run: python "etl/procesos/2026/3. matricula/02_transformacion.py"

    - name: Ejecutar Consolidacion - Matricula
      run: python "etl/procesos/consolidacion/3_matricula.py"

    - name: Ejecutar Ficha Social (fuente compartida) - Descargar
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: python "etl/procesos/2026/6. ficha_social/01_descargar.py"

    - name: Ejecutar Ficha Social (fuente compartida) - Transformacion
      run: python "etl/procesos/2026/6. ficha_social/02_transformacion.py"

    - name: Ejecutar Consolidacion - Ficha Social
      run: python "etl/procesos/consolidacion/6_ficha_social.py"

    - name: Ejecutar Progreso Curricular 2025 - Descargar
      env:
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      run: python "etl/procesos/2025/7. progreso_curricular/01_descarga.py"

    - name: Ejecutar Progreso Curricular 2025 - Transformacion
      run: python "etl/procesos/2025/7. progreso_curricular/02_transformacion.py"

    - name: Ejecutar Progreso Curricular 2026 - Descargar
      env:
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      run: python "etl/procesos/2026/7. progreso_curricular/01_descarga.py"

    - name: Ejecutar Progreso Curricular 2026 - Transformacion
      run: python "etl/procesos/2026/7. progreso_curricular/02_transformacion.py"

    - name: Ejecutar Consolidacion - Progreso Curricular
      run: python "etl/procesos/consolidacion/7_progreso_curricular.py"

    - name: Ejecutar Solicitud Matricula (fuente compartida) - Descargar
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: python "etl/procesos/2026/8. solicitud_matricula/01_descargar.py"

    - name: Ejecutar Solicitud Matricula (fuente compartida) - Transformacion
      run: python "etl/procesos/2026/8. solicitud_matricula/02_transformacion.py"

    - name: Ejecutar Consolidacion - Solicitud Matricula
      run: python "etl/procesos/consolidacion/8_solicitud_matricula.py"

    - name: Ejecutar Horario Regular 2025 - Descargar
      env:
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      run: python "etl/procesos/2025/9. Horario regular/01_descarga.py"

    - name: Ejecutar Horario Regular 2025 - Transformacion
      run: python "etl/procesos/2025/9. Horario regular/02_transformacion.py"

    - name: Ejecutar Horario Regular 2026 - Descargar
      env:
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      run: python "etl/procesos/2026/9. Horario regular/01_descarga.py"

    - name: Ejecutar Horario Regular 2026 - Transformacion
      run: python "etl/procesos/2026/9. Horario regular/02_transformacion.py"

    - name: Ejecutar Consolidacion - Horario Regular
      run: python "etl/procesos/consolidacion/9_horario_regular.py"

    - name: Ejecutar Asistencia Actividades Vivenciales 2025 - Descargar
      env:
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      run: python "etl/procesos/2025/10. Asistencia Actividades Vivenciales/01_descarga.py"

    - name: Ejecutar Asistencia Actividades Vivenciales 2025 - Transformacion
      run: python "etl/procesos/2025/10. Asistencia Actividades Vivenciales/02_transformacion.py"

    - name: Ejecutar Asistencia Actividades Vivenciales 2026 - Descargar
      env:
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      run: python "etl/procesos/2026/10. Asistencia Actividades Vivenciales/01_descarga.py"

    - name: Ejecutar Asistencia Actividades Vivenciales 2026 - Transformacion
      run: python "etl/procesos/2026/10. Asistencia Actividades Vivenciales/02_transformacion.py"

    - name: Ejecutar Consolidacion - Asistencia Actividades Vivenciales
      run: python "etl/procesos/consolidacion/10_asistencia_act_vivenciales.py"

    - name: Ejecutar Habilidades 2025 - Descargar
      env:
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      run: python "etl/procesos/2025/11. Habilidades/01_descarga.py"

    - name: Ejecutar Habilidades 2025 - Transformacion
      run: python "etl/procesos/2025/11. Habilidades/02_transformacion.py"

    - name: Ejecutar Habilidades 2026 - Descargar
      env:
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      run: python "etl/procesos/2026/11. Habilidades/01_descarga.py"

    - name: Ejecutar Habilidades 2026 - Transformacion
      run: python "etl/procesos/2026/11. Habilidades/02_transformacion.py"

    - name: Ejecutar Consolidacion - Habilidades
      run: python "etl/procesos/consolidacion/11_habilidades.py"

    - name: Preparar y validar registros - Asistencia Regular
      env:
        ETL_PUBLICAR_ERRORES: "true"
        SF_USERNAME: ${{ secrets.SF_USERNAME }}
        SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      run: python "etl/procesos/carga/01_asistencia_regular.py"

    - name: Preparar y validar registros - Extracurriculares
      env:
        ETL_PUBLICAR_ERRORES: "true"
        SF_USERNAME: ${{ secrets.SF_USERNAME }}
        SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      run: python "etl/procesos/carga/02_asistencia_extracurricular.py"

    - name: Preparar y validar registros - Matricula
      env:
        ETL_PUBLICAR_ERRORES: "true"
        SF_USERNAME: ${{ secrets.SF_USERNAME }}
        SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      run: python "etl/procesos/carga/03_matricula.py"

    - name: Preparar y validar registros - Ficha Social
      env:
        ETL_PUBLICAR_ERRORES: "true"
        SF_USERNAME: ${{ secrets.SF_USERNAME }}
        SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      run: python "etl/procesos/carga/06_ficha_social.py"

    - name: Preparar y validar registros - Progreso Curricular
      env:
        ETL_PUBLICAR_ERRORES: "true"
        SF_USERNAME: ${{ secrets.SF_USERNAME }}
        SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      run: python "etl/procesos/carga/07_progreso_curricular.py"

    - name: Preparar y validar registros - Solicitud Matricula
      env:
        ETL_PUBLICAR_ERRORES: "true"
        SF_USERNAME: ${{ secrets.SF_USERNAME }}
        SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      run: python "etl/procesos/carga/08_solicitud_matricula.py"

    - name: Preparar y validar registros - Horario Regular
      env:
        ETL_PUBLICAR_ERRORES: "true"
        SF_USERNAME: ${{ secrets.SF_USERNAME }}
        SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      run: python "etl/procesos/carga/09_horario_regular.py"

    - name: Preparar y validar registros - Asistencia Actividades Vivenciales
      env:
        ETL_PUBLICAR_ERRORES: "true"
        SF_USERNAME: ${{ secrets.SF_USERNAME }}
        SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      run: python "etl/procesos/carga/10_asistencia_act_vivenciales.py"

    - name: Preparar y validar registros - Habilidades
      env:
        ETL_PUBLICAR_ERRORES: "true"
        SF_USERNAME: ${{ secrets.SF_USERNAME }}
        SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      run: python "etl/procesos/carga/11_habilidades.py"

    - name: Guardar registros preparados
      uses: actions/upload-artifact@v4
      with:
        name: registros-preparados-${{ github.run_id }}-${{ github.run_attempt }}
        path: data/prepared/
        if-no-files-found: error
        retention-days: 1

    - name: Guardar archivos de preparacion incluso ante fallos
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: preparacion-etl-${{ github.run_id }}-${{ github.run_attempt }}
        path: data/
        if-no-files-found: warn
        retention-days: 1

  cargar:
    needs: etl
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.cargar_salesforce }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Instalar dependencias
      run: python -m pip install -r requirements.txt
    - name: Recuperar registros ya preparados y validados
      uses: actions/download-artifact@v4
      with:
        name: registros-preparados-${{ github.run_id }}-${{ github.run_attempt }}
        path: data/prepared/
    - name: Reemplazar y verificar registros de Salesforce
      env:
        SF_USERNAME: ${{ secrets.SF_USERNAME }}
        SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      run: python -m etl.procesos.carga._carga_segura cargar
    - name: Guardar resultados y lotes para recuperacion
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: resultados-carga-${{ github.run_id }}-${{ github.run_attempt }}
        path: data/load-results.json
        if-no-files-found: warn
        retention-days: 7
